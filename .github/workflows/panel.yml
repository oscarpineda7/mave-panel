# Publica el panel de administración (sitio/admin.html) en GitHub Pages cada vez que cambia main.
# La tienda sigue en Netlify; aquí solo va el panel. La raíz redirige a admin.html.
name: Publicar panel
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}admin.html
    steps:
      - uses: actions/checkout@v4
      - name: Preparar archivos del panel
        run: |
          mkdir _site
          cp -r sitio/admin.html sitio/admin.js sitio/config.js sitio/vendor sitio/img _site/
          printf 'User-agent: *\nDisallow: /\n' > _site/robots.txt
          printf '%s\n' '<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="robots" content="noindex">' \
            '<meta http-equiv="refresh" content="0; url=admin.html"><title>Panel MAVE Mujer</title></head>' \
            '<body><a href="admin.html">Ir al panel de MAVE Mujer</a></body></html>' > _site/index.html
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
